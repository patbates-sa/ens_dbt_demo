version: 2

models:
  - name: time_spine_hourly
    description: Hourly time spine covering five years back through 30 days ahead.
    columns:
      - name: date_hour
        description: Standard hourly join key for MetricFlow time-based queries.
        tests: [unique, not_null]


  - name: fct_incident_telemetry
    description: >
      One row per S1 or S2 incident resolved to a device hostname, enriched with
      monitored-interface telemetry from the hour immediately before opening. Telemetry
      fields remain null when the matched device had no qualifying interface polls.
      Incidents whose CMDB CI cannot be resolved to a hostname are excluded upstream.
    columns:
      - name: incident_number
        description: The incident identifier and grain of the mart.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_incident_telemetry__resolved_incidents')
                field: incident_number
      - name: opened_ts
        description: Timestamp at which the incident opened and the exclusive end of the telemetry window.
        tests: [not_null]
      - name: resolved_ts
        description: Timestamp at which the incident resolved; null for incidents still open.
      - name: severity
        description: Incident severity, restricted to S1 and S2 for this operational mart.
        tests:
          - accepted_values:
              arguments:
                values: ['S1', 'S2']
      - name: assignment_group
        description: ServiceNow assignment group responsible for the incident.
      - name: device_id
        description: Device matched from the incident's canonicalised CMDB CI hostname.
        tests: [not_null]
      - name: site_code
        description: Site associated with the resolved device at the current device-record state.
      - name: avg_util_out
        description: Average outbound utilization across monitored-interface polls in the prior hour.
      - name: peak_util_out
        description: Highest outbound utilization across monitored-interface polls in the prior hour.
      - name: errors
        description: Total inbound and outbound interface errors recorded in the prior hour.
      - name: peak_latency_p95
        description: Highest p95 interface latency recorded in the prior hour.
      - name: peak_loss
        description: Highest interface packet-loss percentage recorded in the prior hour.
      - name: failed_polls
        description: Number of prior-hour interface polls whose status was not successful.
      - name: minutes_to_resolve
        description: Whole minutes from opening to resolution; null while the incident is unresolved.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
